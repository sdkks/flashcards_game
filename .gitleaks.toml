# gitleaks configuration installed by the /setup-gitleaks skill (--project mode).
# Extends the shipped default ruleset with generic PII rules. No personal data
# belongs in this file — personalization lives in the user's global config
# (~/.gitleaks/pii.toml), added only after explicit confirmation.
[extend]
useDefault = true

[[rules]]
id = "home-dir-path"
description = "Absolute home-directory path (macOS, Linux, Windows profile)"
regex = '''(?i)(?:^|[\s"'(=:\[{,])(?:(?:/Users/|/home/)[A-Za-z0-9._-]+/[A-Za-z0-9._~/+-]*|[A-Za-z]:\\Users\\[A-Za-z0-9._-]+\\)'''

[[rules]]
id = "unc-share-path"
description = "Windows UNC network share path"
regex = '''(?i)\\\\[A-Za-z0-9._-]+\\[A-Za-z0-9._$-]+'''

[[rules]]
id = "consumer-email"
description = "Consumer-domain email address"
regex = '''(?i)[A-Za-z0-9._%+-]+@(?:gmail|icloud|outlook|hotmail|protonmail|fastmail)\.(?:com|net|me|ch|co\.uk)'''

[[allowlists]]
description = "Noreply identities are not personal leaks"
regexes = [
  '''(?i)[A-Za-z0-9._%+-]+@users\.noreply\.github\.com''',
]
